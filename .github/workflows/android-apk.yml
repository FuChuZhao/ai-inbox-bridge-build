name: Android APK

on:
  workflow_dispatch:
    inputs:
      sourceRef:
        description: Source repo ref (branch or tag)
        required: true
        default: main
      runUiTests:
        description: Run emulator UI smoke tests
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (build repo)
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Checkout private source via SSH deploy key
        shell: bash
        env:
          SOURCE_REPO_SSH_KEY: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          SOURCE_REF: ${{ inputs.sourceRef }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REPO_SSH_KEY}" ]; then
            echo "Missing SOURCE_REPO_SSH_KEY secret"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "${SOURCE_REPO_SSH_KEY}" > ~/.ssh/source_repo
          chmod 600 ~/.ssh/source_repo
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND='ssh -i ~/.ssh/source_repo -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git clone --depth 1 --branch "${SOURCE_REF}" git@github.com:FuChuZhao/ai-inbox-bridge.git source
          cd source
          git rev-parse HEAD

      - name: Run UI smoke tests (optional)
        if: inputs.runUiTests == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          working-directory: source
          script: |
            chmod +x ./gradlew
            ./gradlew :app:connectedDebugAndroidTest

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/ci-signing.jks"

      - name: Build Release APK
        shell: bash
        working-directory: source
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ci-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: source/app/build/outputs/apk/release/app-release.apk
          retention-days: 1
